# This is a basic workflow to help you get started with Actions

name: Check JMComic Android APK

# Controls when the workflow will run
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependency
        run: |
          python -m pip install --upgrade pip
          pip install jmcomic

      - name: Run Script
        id: script
        run: |
          python main.py

      - name: Release
        if: ${{ steps.script.outputs.found_new == 'true'}}
        uses: softprops/action-gh-release@v1
        with:
          name: v${{ steps.script.outputs.new_ver }}
          tag_name: ${{ steps.script.outputs.new_ver }}
          draft: false
          files: |
            ${{ steps.script.outputs.new_ver }}.apk
          body: |
            # 禁漫APP v${{ steps.script.outputs.new_ver }}

            [<u>📥点击直接下载 v${{ steps.script.outputs.new_ver }} APK</u>](https://github.com/${{ github.repository }}/releases/download/${{ steps.script.outputs.new_ver }}/${{ steps.script.outputs.new_ver }}.apk)

            或者从禁漫官网下载，官网下载链接：

            1. [${{ steps.script.outputs.download_path1 }}](${{ steps.script.outputs.download_path1 }})
            2. [${{ steps.script.outputs.download_path2 }}](${{ steps.script.outputs.download_path2 }})
            3. [https://18comic.vip/stray](https://18comic.vip/stray/)（发布页）
            
            ---

            ### 🍎 苹果 (iOS) 用户安装与使用指南

            禁漫在 iOS 设备上通过 **Safari 描述文件 (WebClip)** 形式运行：

            1. **链接入口**（请务必使用 **Safari 浏览器** 打开）：
               - 官方安装页：[https://18comic.vip/ios_app/index.php](https://18comic.vip/ios_app/index.php)
               - 备用镜像页：[https://jmcomic1.me/ios_app/index.php](https://jmcomic1.me/ios_app/index.php)
            2. **安装步骤**：
               - 打开上述网页，点击「立即安装」允许下载描述文件；
               - 打开 iPhone「设置」→「已下载描述文件」→ 选择「JMComic3」完成信任与安装；
               - 安装后桌面将生成独立应用图标。
            3. **免描述文件简易方案**：
               - 直接在 Safari 打开官网网页版，点击底部分享按钮，选择「添加到主屏幕」即可。

            ---

            `${{ steps.script.outputs.new_ver }}.apk` 的官方更新信息：
            
            > ${{ steps.script.outputs.desc }}

      - name: Commit
        if: ${{ steps.script.outputs.found_new == 'true'}}
        run: |
          # Extract the version number from the previous step
          version=${{ steps.script.outputs.new_ver }}
          git config --global user.email "93357912+hect0x7@users.noreply.github.com"
          git config --global user.name "hect0x7"
          git tag -a "v$version" -m "Version $version"
          git add ./APK_VERSION.txt
          git commit -m "update APK_VERSION.txt"
          git push
          echo "finished"
